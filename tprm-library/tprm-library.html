<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Optro TPRM Prototype</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            :root {
                --optro-navy: #0A3655;
                --optro-navy-hover: #0d4470;
                --optro-bg: #F5F7FA;
                --optro-card: #FFFFFF;
                --optro-text: #1A1A1A;
                --optro-text-muted: #6B7280;
                --optro-border: #E5E7EB;
                --optro-input-bg: #F9FAFB;
            }

            * { box-sizing: border-box; }

            .staticrypt-html, .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                min-height: 100%;
                margin: 0;
                background: var(--optro-bg);
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", system-ui, sans-serif;
                color: var(--optro-text);
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }

            .staticrypt-page {
                width: 100%;
                max-width: 440px;
            }

            .optro-logo {
                display: flex;
                justify-content: center;
                margin-bottom: 32px;
            }

            .optro-logo svg {
                height: 36px;
                width: auto;
            }

            .staticrypt-form {
                background: var(--optro-card);
                border: 1px solid var(--optro-border);
                border-radius: 12px;
                padding: 40px 32px;
                box-shadow: 0 1px 3px rgba(10, 54, 85, 0.04), 0 4px 16px rgba(10, 54, 85, 0.06);
                text-align: center;
            }

            .staticrypt-eyebrow {
                font-size: 12px;
                font-weight: 600;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--optro-navy);
                margin: 0 0 8px;
            }

            .staticrypt-title {
                font-size: 22px;
                font-weight: 600;
                color: var(--optro-text);
                margin: 0 0 20px;
                line-height: 1.3;
                word-break: break-word;
            }

            .staticrypt-instructions {
                font-size: 14px;
                line-height: 1.5;
                color: var(--optro-text-muted);
                margin: 0 0 24px;
            }

            .staticrypt-instructions p {
                margin: 0;
            }

            .staticrypt-password-container {
                position: relative;
                margin-bottom: 16px;
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                width: 100%;
                background: var(--optro-input-bg);
                border: 1px solid var(--optro-border);
                border-radius: 8px;
                font-size: 14px;
                font-family: inherit;
                color: var(--optro-text);
                padding: 12px 44px 12px 14px;
                outline: 0;
                transition: border-color 0.15s ease, box-shadow 0.15s ease;
            }

            .staticrypt-form input[type="password"]:focus,
            .staticrypt-form input[type="text"]:focus {
                border-color: var(--optro-navy);
                box-shadow: 0 0 0 3px rgba(10, 54, 85, 0.1);
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                width: 18px;
                opacity: 0.5;
                padding: 0;
                position: absolute;
                right: 14px;
                top: 50%;
                transform: translateY(-50%);
                transition: opacity 0.15s ease;
            }

            .staticrypt-toggle-password-visibility:hover {
                opacity: 0.8;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                width: 100%;
                background: var(--optro-navy);
                color: #FFFFFF;
                border: 0;
                border-radius: 8px;
                padding: 12px 20px;
                font-size: 14px;
                font-weight: 600;
                font-family: inherit;
                letter-spacing: 0.02em;
                cursor: pointer;
                transition: background 0.15s ease;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: var(--optro-navy-hover);
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                font-size: 13px;
                color: var(--optro-text-muted);
                margin-bottom: 16px;
                cursor: pointer;
            }

            .staticrypt-remember input[type="checkbox"] {
                margin-right: 8px;
                accent-color: var(--optro-navy);
            }

            .staticrypt-footer {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                margin-top: 24px;
                font-size: 12px;
                line-height: 1.5;
                color: var(--optro-text-muted);
            }

            .staticrypt-footer svg {
                width: 12px;
                height: 12px;
                flex-shrink: 0;
                opacity: 0.7;
            }

            .hidden { display: none !important; }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--optro-bg);
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                border: 0.25em solid var(--optro-border);
                border-right-color: var(--optro-navy);
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% { transform: rotate(360deg); }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                .staticrypt-form input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>
    </head>
